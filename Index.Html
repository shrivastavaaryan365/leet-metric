<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leet Metric</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
        <div class="container">
            <!-- Heading
            User
            Stats -->
            <h1 style="background-color: brown; padding: 20px;">
                Leet Metric
            </h1>
            <div class="user-container">
                <p>
                    Enter Your Username Below:
                </p>
                <div class="user-input-container">
                    <input type="text" placeholder="Enter Your Username Here" id="user-input">
                    <button id="search-button"> Search </button>
                </div>
            </div>
            <div class="stats-container"> 
                <div class="progress">
                    <div class="progress-Item">
                        <div class="easy-progress">
                            <Span id="easy-label">
                                Easy
                            </Span>
                        </div>
                    </div>
                    <div class="progres-item">
                        <div class="medium-progress">
                            <Span id="medium-label">
                                Medium
                            </Span>
                    </div>
                    <div class="progres-item">
                        <div class="hard-progress">
                            <Span id="hard-label">
                                Hard
                            </Span>
                    </div>
                </div>
            </div>
        </div>
    <script src="Index.js"></script>
</body>
</html>
